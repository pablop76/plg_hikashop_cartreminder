PLG_HIKASHOP_CARTREMINDER_REVIEW_ASK="We would be grateful for a short rating. Your review helps other customers choose and shows us what to improve."
PLG_HIKASHOP_CARTREMINDER_REVIEW_BUTTON="Rate"
PLG_HIKASHOP_CARTREMINDER_REVIEW_NO_LOGIN="No login needed. The button opens a rating form linked to this order."
PLG_HIKASHOP_CARTREMINDER_REVIEW_HELP="If something was wrong with the order, just reply to this message."
PLG_HIKASHOP_CARTREMINDER_REVIEW_FOOTER="We ask for a review of this order only once."
PLG_HIKASHOP_CARTREMINDER_REVIEW_STOP="I do not want review requests"

