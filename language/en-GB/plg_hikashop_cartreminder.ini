PLG_HIKASHOP_CARTREMINDER_HELLO="Hello,"
PLG_HIKASHOP_CARTREMINDER_PIECES="pcs"
PLG_HIKASHOP_CARTREMINDER_REGARDS="Best regards<br/>%s"

