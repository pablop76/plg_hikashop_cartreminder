; plg_hikashop_cartreminder - abandoned cart and unpaid order reminders, review request

PLG_HIKASHOP_CARTREMINDER="HikaShop - Reminders and review request"
PLG_HIKASHOP_CARTREMINDER_DESCRIPTION="Sends customers a reminder about an abandoned cart and about an unpaid order, and asks for a review a few days after the order was shipped. Runs on the HikaShop cron; the messages can be edited in HikaShop → System → Emails."

; Configuration
PLG_HIKASHOP_CARTREMINDER_MODE_LABEL="What to remind about"
PLG_HIKASHOP_CARTREMINDER_MODE_DESC="Unpaid orders, abandoned carts, both or nothing. The review request is switched on separately, in the Review request tab."
PLG_HIKASHOP_CARTREMINDER_MODE_BOTH="Orders and carts"
PLG_HIKASHOP_CARTREMINDER_MODE_ORDERS="Unpaid orders only"
PLG_HIKASHOP_CARTREMINDER_MODE_CARTS="Abandoned carts only"
PLG_HIKASHOP_CARTREMINDER_MODE_NONE="Nothing"
PLG_HIKASHOP_CARTREMINDER_TEST_MODE_LABEL="Test mode"
PLG_HIKASHOP_CARTREMINDER_TEST_MODE_DESC="Every message goes to the test address, with the real recipient shown in the subject. Customers receive nothing. Test entries do not block the real sending later."
PLG_HIKASHOP_CARTREMINDER_TEST_EMAIL_LABEL="Test address"
PLG_HIKASHOP_CARTREMINDER_TEST_EMAIL_DESC="Without this address the plugin sends nothing in test mode."
PLG_HIKASHOP_CARTREMINDER_LIMIT_LABEL="Messages per run"
PLG_HIKASHOP_CARTREMINDER_LIMIT_DESC="At most this many reminders per HikaShop cron call."
PLG_HIKASHOP_CARTREMINDER_MAX_AGE_LABEL="Not older than (days)"
PLG_HIKASHOP_CARTREMINDER_MAX_AGE_DESC="Older carts and orders are skipped. The value must be greater than the delays set below."
PLG_HIKASHOP_CARTREMINDER_MIN_GAP_LABEL="Gap per address (days)"
PLG_HIKASHOP_CARTREMINDER_MIN_GAP_DESC="One email address gets at most one reminder in this period, even when the customer has several carts."
PLG_HIKASHOP_CARTREMINDER_EXCLUDED_EMAILS_LABEL="Excluded addresses"
PLG_HIKASHOP_CARTREMINDER_EXCLUDED_EMAILS_DESC="Email addresses the plugin never writes to, neither about a cart, an order nor with a review request. One per line or comma-separated."
PLG_HIKASHOP_CARTREMINDER_RETENTION_LABEL="Log retention"
PLG_HIKASHOP_CARTREMINDER_RETENTION_DESC="After this time reminder entries are deleted together with the recovery statistics. The opt-out list stays."
PLG_HIKASHOP_CARTREMINDER_RETENTION_30="30 days"
PLG_HIKASHOP_CARTREMINDER_RETENTION_60="60 days"
PLG_HIKASHOP_CARTREMINDER_RETENTION_90="90 days"
PLG_HIKASHOP_CARTREMINDER_RETENTION_180="180 days"

PLG_HIKASHOP_CARTREMINDER_CARTS_FIELDSET="Abandoned carts"
PLG_HIKASHOP_CARTREMINDER_CART_DELAY_LABEL="Delay (hours)"
PLG_HIKASHOP_CARTREMINDER_CART_DELAY_DESC="Hours that must pass since the last cart change before the reminder is sent."
PLG_HIKASHOP_CARTREMINDER_LINK_DAYS_LABEL="Cart link validity (days)"
PLG_HIKASHOP_CARTREMINDER_LINK_DAYS_DESC="The cart button works for this many days after the email was sent. Later the link shows a message and restores nothing."
PLG_HIKASHOP_CARTREMINDER_CONSENT_LABEL="Who gets the cart reminder"
PLG_HIKASHOP_CARTREMINDER_CONSENT_DESC="A cart reminder is a commercial message and needs the recipient's consent. The safe setting is confirmed AcyMailing subscribers. Check with a lawyer before choosing everyone."
PLG_HIKASHOP_CARTREMINDER_CONSENT_ALL="Everyone with an email address"
PLG_HIKASHOP_CARTREMINDER_CONSENT_ACYM="Confirmed AcyMailing subscribers only"
PLG_HIKASHOP_CARTREMINDER_ACYM_LISTS_LABEL="AcyMailing lists (ids)"
PLG_HIKASHOP_CARTREMINDER_ACYM_LISTS_DESC="Comma-separated list ids, e.g. 1. Empty means any list."
PLG_HIKASHOP_CARTREMINDER_SKIP_CATEGORIES_LABEL="Skip carts with categories (ids)"
PLG_HIKASHOP_CARTREMINDER_SKIP_CATEGORIES_DESC="Comma-separated HikaShop category ids. A cart holding a product from such a category gets no reminder. Useful e.g. for alcohol categories."

PLG_HIKASHOP_CARTREMINDER_ORDERS_FIELDSET="Unpaid orders"
PLG_HIKASHOP_CARTREMINDER_ORDER_DELAY_LABEL="Delay (hours)"
PLG_HIKASHOP_CARTREMINDER_ORDER_DELAY_DESC="Hours that must pass since an order was placed without payment. Unpaid statuses come from the HikaShop configuration."
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_METHODS_LABEL="Methods with a longer delay"
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_METHODS_DESC="Comma-separated payment plugin names, e.g. banktransfer. A bank transfer takes time, so these orders wait longer."
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_DELAY_LABEL="Longer delay (hours)"
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_DELAY_DESC="Delay for the methods listed above."
PLG_HIKASHOP_CARTREMINDER_ORDER_SKIP_METHODS_LABEL="Methods without reminders"
PLG_HIKASHOP_CARTREMINDER_ORDER_SKIP_METHODS_DESC="Comma-separated payment plugin names, e.g. collectondelivery. A cash on delivery order is unpaid by design."

PLG_HIKASHOP_CARTREMINDER_REVIEWS_FIELDSET="Review request"
PLG_HIKASHOP_CARTREMINDER_REVIEW_LABEL="Send review requests"
PLG_HIKASHOP_CARTREMINDER_REVIEW_DESC="One email a few days after the order was shipped, with a Rate button next to each product. The rating form works without logging in, also for guests."
PLG_HIKASHOP_CARTREMINDER_REVIEW_STATUSES_LABEL="Shipped order statuses"
PLG_HIKASHOP_CARTREMINDER_REVIEW_STATUSES_DESC="Comma-separated HikaShop status codes, e.g. shipped. The date of the last change to such a status in the order history counts. The order must still have this status."
PLG_HIKASHOP_CARTREMINDER_REVIEW_DELAY_LABEL="Delay (days)"
PLG_HIKASHOP_CARTREMINDER_REVIEW_DELAY_DESC="The review request goes out this many days after the order was shipped, so the parcel can arrive and the customer can try the products."
PLG_HIKASHOP_CARTREMINDER_REVIEW_WINDOW_LABEL="Sending window (days)"
PLG_HIKASHOP_CARTREMINDER_REVIEW_WINDOW_DESC="Orders shipped earlier than the delay plus this window are skipped, so customers from months ago get nothing when the feature is switched on."
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_LABEL="Who gets the review request"
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_DESC="A separate review request email may count as a commercial message that needs the recipient's consent. Check with a lawyer before choosing all buyers."
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_ALL="All buyers"
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_ACYM="Confirmed AcyMailing subscribers only"
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_FIELD="Only customers who ticked consent at checkout"
PLG_HIKASHOP_CARTREMINDER_REVIEW_FIELD_LABEL="Consent field in the order"
PLG_HIKASHOP_CARTREMINDER_REVIEW_FIELD_DESC="Column name of a HikaShop custom field of the order table, e.g. review_consent. Consent means a value other than empty and 0. A field that does not exist means no consent."

; Email names in HikaShop → System → Emails
PLG_HIKASHOP_CARTREMINDER_MAIL_CART_REMINDER="Abandoned cart reminder"
PLG_HIKASHOP_CARTREMINDER_MAIL_ORDER_PAYMENT_REMINDER="Unpaid order reminder"
PLG_HIKASHOP_CARTREMINDER_MAIL_ORDER_REVIEW_REQUEST="Review request after shipping"

