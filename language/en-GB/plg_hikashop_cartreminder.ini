PLG_HIKASHOP_CARTREMINDER_CART_BUTTON="Back to my cart"
PLG_HIKASHOP_CARTREMINDER_CART_HELP="If something got in the way, for example payment or delivery, just reply to this message. We will help."
PLG_HIKASHOP_CARTREMINDER_CART_FOOTER="We remind about this cart only once. The message was sent to the address given in our shop during checkout."
