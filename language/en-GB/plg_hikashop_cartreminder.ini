PLG_HIKASHOP_CARTREMINDER_ORDER_BUTTON="Pay for my order"
PLG_HIKASHOP_CARTREMINDER_ORDER_PAID="If the payment is already on its way, for example by bank transfer, please ignore this message."
PLG_HIKASHOP_CARTREMINDER_ORDER_HELP="If you have any questions, just reply to this message."

