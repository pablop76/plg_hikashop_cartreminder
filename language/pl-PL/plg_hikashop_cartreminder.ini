; plg_hikashop_cartreminder - przypomnienia o porzuconym koszyku i nieopłaconym zamówieniu, prośba o opinię

PLG_HIKASHOP_CARTREMINDER="HikaShop - Przypomnienia i prośba o opinię"
PLG_HIKASHOP_CARTREMINDER_DESCRIPTION="Wysyła klientom przypomnienie o porzuconym koszyku i o nieopłaconym zamówieniu oraz prośbę o opinię kilka dni po wysłaniu zamówienia. Działa przez cron HikaShop, a treść wiadomości można zmienić w HikaShop → System → E-maile."

