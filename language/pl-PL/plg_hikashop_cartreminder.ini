PLG_HIKASHOP_CARTREMINDER_EXCLUDED_EMAILS_DESC="Adresy e-mail, do których wtyczka nie pisze nigdy: ani o koszyku, ani o zamówieniu, ani z prośbą o opinię. Po jednym w wierszu albo po przecinku."
PLG_HIKASHOP_CARTREMINDER_RETENTION_LABEL="Przechowywanie dziennika"
PLG_HIKASHOP_CARTREMINDER_RETENTION_DESC="Po tym czasie wpisy o przypomnieniach są kasowane razem ze statystyką odzysku. Lista rezygnacji zostaje."
PLG_HIKASHOP_CARTREMINDER_RETENTION_30="30 dni"
PLG_HIKASHOP_CARTREMINDER_RETENTION_60="60 dni"
PLG_HIKASHOP_CARTREMINDER_RETENTION_90="90 dni"
PLG_HIKASHOP_CARTREMINDER_RETENTION_180="180 dni"

PLG_HIKASHOP_CARTREMINDER_CARTS_FIELDSET="Porzucone koszyki"
PLG_HIKASHOP_CARTREMINDER_CART_DELAY_LABEL="Opóźnienie (godziny)"
PLG_HIKASHOP_CARTREMINDER_CART_DELAY_DESC="Tyle godzin musi minąć od ostatniej zmiany koszyka, zanim pójdzie przypomnienie."
PLG_HIKASHOP_CARTREMINDER_LINK_DAYS_LABEL="Ważność linku do koszyka (dni)"
PLG_HIKASHOP_CARTREMINDER_LINK_DAYS_DESC="Tyle dni od wysłania maila działa przycisk „Wracam do koszyka”. Potem link pokazuje komunikat i niczego nie przywraca."
PLG_HIKASHOP_CARTREMINDER_CONSENT_LABEL="Kto dostaje przypomnienie o koszyku"
PLG_HIKASHOP_CARTREMINDER_CONSENT_DESC="Przypomnienie o koszyku jest wiadomością handlową i wymaga zgody odbiorcy. Bezpieczne ustawienie to potwierdzeni subskrybenci AcyMailing. Wybór „Wszyscy” warto najpierw uzgodnić z prawnikiem."
PLG_HIKASHOP_CARTREMINDER_CONSENT_ALL="Wszyscy z adresem e-mail"
PLG_HIKASHOP_CARTREMINDER_CONSENT_ACYM="Tylko potwierdzeni subskrybenci AcyMailing"
PLG_HIKASHOP_CARTREMINDER_ACYM_LISTS_LABEL="Listy AcyMailing (id)"
PLG_HIKASHOP_CARTREMINDER_ACYM_LISTS_DESC="Identyfikatory list po przecinku, np. 1. Puste pole oznacza dowolną listę."
PLG_HIKASHOP_CARTREMINDER_SKIP_CATEGORIES_LABEL="Pomiń koszyki z kategorii (id)"
PLG_HIKASHOP_CARTREMINDER_SKIP_CATEGORIES_DESC="Identyfikatory kategorii HikaShop po przecinku. Koszyk z produktem z takiej kategorii nie dostanie przypomnienia. Przydatne np. dla kategorii z alkoholem."

PLG_HIKASHOP_CARTREMINDER_ORDERS_FIELDSET="Nieopłacone zamówienia"
PLG_HIKASHOP_CARTREMINDER_ORDER_DELAY_LABEL="Opóźnienie (godziny)"
PLG_HIKASHOP_CARTREMINDER_ORDER_DELAY_DESC="Tyle godzin musi minąć od złożenia zamówienia bez płatności. Za nieopłacone uznajemy statusy z konfiguracji HikaShop."
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_METHODS_LABEL="Metody z dłuższym opóźnieniem"
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_METHODS_DESC="Nazwy wtyczek płatności po przecinku, np. banktransfer. Przelew potrzebuje czasu, więc takie zamówienia czekają dłużej."
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_DELAY_LABEL="Dłuższe opóźnienie (godziny)"
PLG_HIKASHOP_CARTREMINDER_ORDER_SLOW_DELAY_DESC="Opóźnienie dla metod z pola powyżej."
PLG_HIKASHOP_CARTREMINDER_ORDER_SKIP_METHODS_LABEL="Metody bez przypomnień"
PLG_HIKASHOP_CARTREMINDER_ORDER_SKIP_METHODS_DESC="Nazwy wtyczek płatności po przecinku, np. collectondelivery. Zamówienie za pobraniem jest nieopłacone z założenia."

PLG_HIKASHOP_CARTREMINDER_REVIEWS_FIELDSET="Prośba o opinię"
PLG_HIKASHOP_CARTREMINDER_REVIEW_LABEL="Wysyłaj prośbę o opinię"
PLG_HIKASHOP_CARTREMINDER_REVIEW_DESC="Jeden mail kilka dni po wysłaniu zamówienia, z przyciskiem „Oceń” przy każdym produkcie. Formularz oceny działa bez logowania, także dla gości."
PLG_HIKASHOP_CARTREMINDER_REVIEW_STATUSES_LABEL="Statusy wysłanego zamówienia"
PLG_HIKASHOP_CARTREMINDER_REVIEW_STATUSES_DESC="Kody statusów HikaShop po przecinku, np. shipped. Liczy się data ostatniej zmiany na taki status w historii zamówienia. Zamówienie musi mieć ten status nadal."
PLG_HIKASHOP_CARTREMINDER_REVIEW_DELAY_LABEL="Opóźnienie (dni)"
PLG_HIKASHOP_CARTREMINDER_REVIEW_DELAY_DESC="Tyle dni po wysłaniu zamówienia idzie prośba o opinię. Paczka zdąży dotrzeć, a klient spróbować produktów."
PLG_HIKASHOP_CARTREMINDER_REVIEW_WINDOW_LABEL="Okno wysyłki (dni)"
PLG_HIKASHOP_CARTREMINDER_REVIEW_WINDOW_DESC="Zamówienia wysłane wcześniej niż opóźnienie plus okno są pomijane. Po włączeniu funkcji nie piszemy więc do klientów sprzed miesięcy."
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_LABEL="Kto dostaje prośbę o opinię"
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_DESC="Osobny mail z prośbą o opinię może zostać uznany za wiadomość handlową, która wymaga zgody odbiorcy. Wybór „Wszyscy kupujący” warto najpierw uzgodnić z prawnikiem."
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_ALL="Wszyscy kupujący"
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_ACYM="Tylko potwierdzeni subskrybenci AcyMailing"
PLG_HIKASHOP_CARTREMINDER_REVIEW_CONSENT_FIELD="Tylko klienci, którzy zaznaczyli zgodę w kasie"
PLG_HIKASHOP_CARTREMINDER_REVIEW_FIELD_LABEL="Pole zgody w zamówieniu"
PLG_HIKASHOP_CARTREMINDER_REVIEW_FIELD_DESC="Nazwa kolumny pola własnego HikaShop dla tabeli zamówień, np. zgoda_opinia. Zgoda jest wtedy, gdy pole ma wartość inną niż pusta i 0. Pole, którego nie ma, oznacza brak zgody."

