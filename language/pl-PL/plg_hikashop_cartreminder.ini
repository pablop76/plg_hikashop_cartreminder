PLG_HIKASHOP_CARTREMINDER_TEST_MODE_DESC="Wszystkie wiadomości idą na adres testowy, a właściwy adresat jest w temacie. Klienci nic nie dostają. Wpisy testowe nie blokują późniejszej prawdziwej wysyłki."
PLG_HIKASHOP_CARTREMINDER_TEST_EMAIL_LABEL="Adres testowy"
PLG_HIKASHOP_CARTREMINDER_TEST_EMAIL_DESC="Bez tego adresu wtyczka w trybie testowym nic nie wysyła."
