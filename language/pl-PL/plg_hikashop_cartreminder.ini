PLG_HIKASHOP_CARTREMINDER_LIMIT_DESC="Najwyżej tyle przypomnień przy jednym wywołaniu crona HikaShop."
PLG_HIKASHOP_CARTREMINDER_MAX_AGE_LABEL="Nie starsze niż (dni)"
PLG_HIKASHOP_CARTREMINDER_MAX_AGE_DESC="Starsze koszyki i zamówienia są pomijane. Wartość musi być większa niż ustawione opóźnienia."
PLG_HIKASHOP_CARTREMINDER_MIN_GAP_LABEL="Odstęp dla jednego adresu (dni)"
PLG_HIKASHOP_CARTREMINDER_MIN_GAP_DESC="Na jeden adres e-mail idzie w tym czasie najwyżej jedno przypomnienie, także gdy klient ma kilka koszyków."
